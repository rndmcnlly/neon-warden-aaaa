# Neon Warden: 90 s gameplay trailer (cut sheet, data only).
#
# Template: hook, then Tell-Show-Repeat over the verbs (Derek Lieu), a
# places-and-memory montage, then the Warden in three moves (hype, deflate,
# turn) and a pacifist-run tease instead of an ending spoiler.
#
# Music: gameplay cue (129.2 BPM, beat 0.464 s) for the first half, boss cue
# (143.55 BPM, beat 0.418 s) from the Warden onward. A shot's `beats` use the
# tempo of the music segment playing when the shot starts; segment
# boundaries coincide with shot boundaries, so cuts stay on the grid.

id: trailer90
title: "Gameplay trailer, 90 s"
audience: public
targetSeconds: 90
viewport: { width: 1280, height: 720 }
master: { width: 1920, height: 1080, fps: 30 }
loudness: { lufs: -16, truePeak: -2 }
captions: burned+srt
speakerLabels: true

music:
  edit:
    - { cue: gameplay, from: 16, beats: 96 }
    - { cue: boss, from: 0, beats: 24 } # Warden build-up
    - { silence: 24 } # deflation: "STOP!" and the AI's aside
    - { cue: boss, from: 48, beats: 62, fadeOut: 3 }
  duckUnderVoiceDb: -9

# Takes are re-timed for true speed (October 29, 2026; event map in
# research/2026-10-29-trailer-render/). Each ends on an `until` probe for the
# last event a shot needs. The first pickup of any run freezes the sim for the
# flashback (about 55 s), so takes that need play after it pre-roll through
# it and `roll` (start the take) when the sim resumes; `nth` counts from the
# roll. These recipes are identical in teaser30.yaml, so the takes are shared.
takes:
  s1-fight:
    query: "?skipto=sector1&autoplay=fight&speed=1"
    settings: { audio: { music: 0, voice: 0 }, subtitles: { enabled: false } }
    steps:
      - do: until
        probe: "p.log.includes('line:flash_ai_002') && !p.sim().frozen && (globalThis.__nwRoll = p.sim().tick) >= 0"
        timeoutMs: 120000
        label: "flashback over, sim resumed"
      - { do: roll }
      - do: until
        probe: "p.events.filter((e) => e.tick > globalThis.__nwRoll && e.type === 'kill').length >= 9"
        timeoutMs: 60000
        label: "nine kills after the flashback"
      - { do: wait, ms: 3000 }
    maxSeconds: 150
  s2-fight:
    query: "?skipto=sector2&autoplay=fight&speed=1"
    settings: { audio: { music: 0, voice: 0 }, subtitles: { enabled: false } }
    steps:
      - do: until
        probe: "p.events.filter((e) => e.type === 'partBreak' && e.by === 'writ').length >= 2"
        timeoutMs: 40000
        label: "second Writ break"
      - { do: wait, ms: 4000 }
    maxSeconds: 45
  s3-recorder:
    query: "?skipto=sector3&autoplay=fight&speed=1"
    settings: { audio: { music: 0, voice: 0 }, subtitles: { enabled: false } }
    steps:
      - do: until
        probe: "p.log.includes('line:flash_rec_001')"
        timeoutMs: 60000
        label: "flash_rec_001 starts"
      - { do: wait, ms: 9000 }
    maxSeconds: 80
  s3-fight:
    query: "?skipto=sector3&autoplay=fight&speed=1"
    settings: { audio: { music: 0, voice: 0 }, subtitles: { enabled: false } }
    steps:
      - do: until
        probe: "p.log.includes('line:flash_ai_002') && !p.sim().frozen && (globalThis.__nwRoll = p.sim().tick) >= 0"
        timeoutMs: 120000
        label: "flashback over, sim resumed"
      - { do: roll }
      - do: until
        probe: "p.events.filter((e) => e.tick > globalThis.__nwRoll && e.type === 'kill').length >= 5"
        timeoutMs: 60000
        label: "five kills after the flashback"
      - { do: wait, ms: 3000 }
    maxSeconds: 180
  s3-disarm:
    # The pacifist autopilot disarms once per run: the sector 3 turret, about
    # 0.8 s before the recorder pickup freezes the world, so disarm shots end
    # just after the break (measured; no later disarm in 90 s of sectors 1-5).
    query: "?skipto=sector3&autoplay=pacifist&speed=1"
    settings: { audio: { music: 0, voice: 0 }, subtitles: { enabled: false } }
    steps:
      - do: until
        probe: "p.events.some((e) => e.type === 'disarm')"
        timeoutMs: 30000
        label: "the turret disarm"
      - { do: wait, ms: 3000 }
    maxSeconds: 40
  s4-fight:
    query: "?skipto=sector4&autoplay=fight&speed=1"
    settings: { audio: { music: 0, voice: 0 }, subtitles: { enabled: false } }
    steps:
      - do: until
        probe: "p.log.includes('line:flash_ai_002') && !p.sim().frozen && (globalThis.__nwRoll = p.sim().tick) >= 0"
        timeoutMs: 120000
        label: "flashback over, sim resumed"
      - { do: roll }
      - do: until
        probe: "p.events.some((e) => e.tick > globalThis.__nwRoll && e.type === 'graze' && e.meter >= 0.3)"
        timeoutMs: 40000
        label: "graze meter 0.3 after the flashback"
      - { do: wait, ms: 3000 }
    maxSeconds: 170
  s5-fight:
    query: "?skipto=sector5&autoplay=fight&speed=1"
    settings: { audio: { music: 0, voice: 0 }, subtitles: { enabled: false } }
    steps:
      - do: until
        probe: "p.events.some((e) => e.type === 'graze' && e.meter >= 0.3)"
        timeoutMs: 30000
        label: "graze meter 0.3"
      - { do: wait, ms: 1500 }
    maxSeconds: 30
  boss-descent:
    query: "?skipto=boss"
    settings: { audio: { music: 0, voice: 0 }, subtitles: { enabled: false } }
    steps:
      - do: until
        probe: "p.log.includes('line:desc_ai_001')"
        timeoutMs: 40000
        label: "desc_ai_001 starts"
      - { do: wait, ms: 6000 }
    maxSeconds: 60
  boss-fight:
    # Pre-roll through the descent dialogue; the take runs from the first
    # graze through the Warden's turn. Since b87a24e the turn is a parley
    # (the Warden holds still and talks) and the autopilot holds fire to hear
    # it, so boss_turn_001/002 play in the take; no shot needs the kill.
    # Identical recipe in teaser30 and trailer90, so it is captured once.
    query: "?skipto=boss&autoplay=fight&speed=1"
    settings: { audio: { music: 0, voice: 0 }, subtitles: { enabled: false } }
    steps:
      - do: until
        probe: "p.log.includes('line:graze_ai_001')"
        timeoutMs: 90000
        label: "first graze in the boss fight"
      - { do: roll }
      - do: until
        probe: "p.log.includes('line:boss_turn_002')"
        timeoutMs: 180000
        label: "the turn's second line starts"
      - { do: wait, ms: 6000 }
    maxSeconds: 230
  boss-pacifist:
    # Cold gun through the descent: the Warden notices (desc_pac_001).
    query: "?skipto=boss&autoplay=pacifist&speed=1"
    settings: { audio: { music: 0, voice: 0 }, subtitles: { enabled: false } }
    steps:
      - do: until
        probe: "p.log.includes('line:desc_pac_001')"
        timeoutMs: 60000
        label: "desc_pac_001 starts"
      - { do: wait, ms: 7000 }
    maxSeconds: 70

shots:
  # A. Hook (16 beats, about 7.4 s)
  # Blind judge: lead with the curtain; no place twice in the hook.
  - id: hook-graze
    beats: 4
    purpose: "Threading a bullet curtain; graze sparks."
    take: s5-fight
    anchor: { event: graze, where: "e.meter >= 0.3" }
    align: 2
    game: -10
  - id: hook-writ
    beats: 4
    purpose: "Scene lift: a Writ cracks a pod in the first second."
    take: s4-fight
    anchor: { event: partBreak, where: "e.by === 'writ'" }
    align: 2
    game: -8
  - id: hook-boss
    beats: 4
    purpose: "Densest curtain in the slice: the Warden's pattern with the graze meter near full (replaces a second sector 4 shot, blind judge)."
    take: boss-fight
    anchor: { event: graze, where: "e.meter >= 0.8" }
    align: 2
    game: -8
  - id: title-flash
    beats: 4
    purpose: "Name within 10 s: who and what, then straight back to play."
    card: title
  # B. Tell, show, repeat over the verbs (52 beats, about 24 s)
  - id: tell-fire
    beats: 4
    card: tell-fire
    purpose: "Tell: the three ways to pull one trigger."
  - id: show-fire
    beats: 8
    purpose: "Show: aimed taps, then a held stream, in one unbroken shot."
    take: s1-fight
    anchor: { event: kill, nth: 4 }
    align: 4
    game: -6
  - id: show-writ
    beats: 8
    purpose: "Show: rest, the charge meter climbs, release; the receipt is the pod break."
    take: s2-fight
    anchor: { event: partBreak, where: "e.by === 'writ'", nth: 1 }
    align: 6
    game: -4
  - id: tell-scan
    beats: 4
    card: tell-scan
    purpose: "Tell: resting also scans."
  - id: show-scan
    beats: 6
    purpose: "Show: scan lock and the intel tag."
    take: s2-fight
    anchor: { event: scanLock }
    align: 2
    game: -6
  - id: tell-graze
    beats: 4
    card: tell-graze
    purpose: "Tell: risk pays."
  - id: show-graze
    beats: 6
    purpose: "Show: dense graze window, the multiplier climbs."
    take: s4-fight
    anchor: { event: graze, where: "e.meter >= 0.3" }
    align: 2
    game: -6
  - id: tell-disarm
    beats: 4
    card: tell-disarm
    purpose: "Tell: the moral verb."
  - id: show-disarm
    beats: 8
    purpose: "Show: a gun breaks off and the enemy is spared (pacifist autopilot, sector 3)."
    take: s3-disarm
    anchor: { event: disarm }
    align: 5 # the break lands 0.8 s before the pickup freeze
    game: -4
  # C. Places and memory (28 beats, about 13 s)
  # Places carry action: each is anchored on a kill, not on a vista.
  - id: place-s1
    beats: 4
    purpose: "Sector 1 as a place, mid-fight."
    take: s1-fight
    anchor: { event: kill, nth: 8 }
    align: 2
    game: -10
  - id: place-s3
    beats: 4
    purpose: "Sector 3 as a place, mid-fight."
    take: s3-fight
    anchor: { event: kill, nth: 4 }
    align: 2
    game: -10
  - id: place-s5
    beats: 4
    purpose: "Sector 5 as a place, mid-fight."
    take: s5-fight
    anchor: { event: kill }
    align: 3
    game: -10
  - id: recorder
    beats: 16
    purpose: "The derelict flight recorder of #0121: the story enters mid-play."
    take: s3-recorder
    anchor: { line: flash_rec_001 }
    align: 1
    game: -10
  # D. Build-up (boss cue, 24 beats, about 10 s)
  - id: warden-shadow
    beats: 12
    purpose: "Hype voice over the descent: the scary register belongs to the briefing."
    take: boss-pacifist # the descent from frame 0; boss-descent is too short for 24 beats before desc_001
    anchor: { at: 0 }
    align: 0
    game: -8
  - id: warden-rings
    beats: 12
    purpose: "The Warden fills the frame."
    take: boss-descent
    anchor: { line: desc_001 }
    align: 12.5
    game: -8
  # E. Deflation (silence, 22 beats, about 9.2 s)
  - id: warden-stop
    beats: 16
    purpose: "Music dead; the real Warden is shrill and furious."
    take: boss-descent
    anchor: { line: desc_001 }
    align: 0.5
    game: 0
  - id: ai-aside
    beats: 8
    purpose: "Button joke: the onboarding AI notices."
    take: boss-descent
    anchor: { line: desc_ai_001 }
    align: 0.5
    game: 0
  # F. Boss montage (music slams back, 30 beats, about 12.5 s)
  - id: boss-pods
    beats: 4
    purpose: "A pod breaks."
    take: boss-fight
    anchor: { event: partBreak, where: "e.target === 'boss'" }
    align: 2
    game: -6
  - id: boss-core
    beats: 4
    purpose: "Core exposed."
    take: boss-fight
    anchor: { event: coreExposed }
    align: 1
    game: -6
  - id: boss-phase
    beats: 11
    purpose: "Phase escalation, bullet density peaks on the music's peak."
    take: boss-fight
    anchor: { event: bossPhase, where: "e.phase === 3" }
    align: 2
    game: -6
  - id: boss-turn
    beats: 11
    purpose: "The turn: the lanes are about ownership."
    take: boss-fight
    # The parley: picture is the Warden saying it (VO is still laid in post,
    # muted in the take, per language).
    anchor: { line: boss_turn_002 }
    align: 0.5
    game: -6
  # G. Pacifist tease, title, slate (32 beats, about 13.4 s)
  - id: tell-pacifist
    beats: 4
    card: tell-pacifist
    purpose: "The alternative, without spoiling where it leads."
  - id: pacifist-dodge
    beats: 14
    purpose: "Cold gun; the Warden notices and is baffled."
    take: boss-pacifist
    anchor: { line: desc_pac_001 }
    align: 0.5
    game: -6
  - id: title
    beats: 6
    card: title
    purpose: "Title on the final hit."
  - id: slate
    beats: 8
    card: slate
    purpose: "End slate with call to action."

vo:
  - { line: flash_rec_001, shot: recorder, offset: 0.1 }
  - { line: brief_warden_003, shot: warden-shadow, offset: 0.5 }
  - { line: desc_001, shot: warden-stop, offset: 0.5 }
  - { line: desc_ai_001, shot: ai-aside, offset: 0.5 }
  - { line: boss_turn_002, shot: boss-turn, offset: 0.5 }
  - { line: desc_pac_001, shot: pacifist-dodge, offset: 0.5 }

cards:
  title:
    style: title
    text: { en: "NEON WARDEN", es: "NEON WARDEN", zh: "霓虹守望者" }
  tell-fire:
    style: tell
    text:
      en: "TAP. HOLD. REST TO CHARGE."
      es: "TOCA. MANTÉN. DESCANSA PARA CARGAR."
      zh: "点射。连射。停火蓄力。"
  tell-scan:
    style: tell
    text:
      en: "RESTING SCANS THEM."
      es: "AL DESCANSAR, LOS ESCANEAS."
      zh: "停火时自动扫描。"
  tell-graze:
    style: tell
    text:
      en: "CLOSE CALLS PAY MORE."
      es: "LOS ROCES PAGAN MÁS."
      zh: "擦弹越近，报酬越高。"
  tell-disarm:
    style: tell
    text:
      en: "BREAK THE GUN. SPARE THE SHIP."
      es: "ROMPE EL ARMA. PERDONA LA NAVE."
      zh: "打掉武器，放过飞船。"
  tell-pacifist:
    style: tell
    text:
      en: "OR NEVER FIRE AT ALL."
      es: "O NO DISPARES NUNCA."
      zh: "或者，一枪不开。"
  slate:
    style: slate
    text:
      en: "A vertical slice.\nPlay it in your browser. No install."
      es: "Un vertical slice.\nJuégalo en tu navegador. Sin instalar."
      zh: "垂直切片试玩版\n浏览器即玩，无需安装"
    # {{PLAY_URL}} comes from TRAILER_PLAY_URL (neon-warden-aaaa.adamsmith.systems).
    small:
      en: "Play: {{PLAY_URL}}\nSource: github.com/rndmcnlly/neon-warden-aaaa"
      es: "Juega: {{PLAY_URL}}\nCódigo: github.com/rndmcnlly/neon-warden-aaaa"
      zh: "试玩：{{PLAY_URL}}\n源代码：github.com/rndmcnlly/neon-warden-aaaa"
