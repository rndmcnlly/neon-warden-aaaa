# Neon Warden: 30 s teaser (cut sheet, data only).
#
# Concept: the Warden in three moves, compressed. Gameplay from frame 0
# (scene lift), the Lane Authority briefing voice hypes the Warden over play,
# the music stops dead and the real Warden squeaks "STOP!", title on the
# music's re-entry, one line of doubt, end slate.
#
# Timing is in beats of the music cue (boss, 143.55 BPM: 1 beat = 0.418 s,
# 1 bar = 1.672 s), so every cut lands on a beat by construction. Schema and
# field meanings: trailer/README.md. Research, concerns and the judge panel
# that revised this sheet: research/2026-10-29-trailer-prep/README.md.

id: teaser30
title: "Teaser, 30 s"
audience: public
targetSeconds: 30
viewport: { width: 1280, height: 720 }
master: { width: 1920, height: 1080, fps: 30 }
loudness: { lufs: -16, truePeak: -2 }
captions: burned+srt
speakerLabels: true

music:
  cue: boss
  # Cue beats count from the manifest's beatOffset; segments play in order.
  edit:
    - { from: 32, beats: 33 }
    - { silence: 15 } # stopdown under "STOP!"
    - { from: 64, beats: 24, fadeOut: 2.5 }
  duckUnderVoiceDb: -9

# Takes are re-timed for true speed (October 29, 2026; event map in
# research/2026-10-29-trailer-render/). Each ends on an `until` probe for the
# last event a shot needs. The first pickup of any run freezes the sim for the
# flashback (about 55 s), so takes that need play after it pre-roll through
# it and `roll` (start the take) when the sim resumes; `nth` counts from the
# roll. These recipes are identical in trailer90.yaml, so the takes are shared.
takes:
  s2-fight:
    query: "?skipto=sector2&autoplay=fight&speed=1"
    settings: { audio: { music: 0, voice: 0 }, subtitles: { enabled: false } }
    steps:
      - do: until
        probe: "p.events.filter((e) => e.type === 'partBreak' && e.by === 'writ').length >= 2"
        timeoutMs: 40000
        label: "second Writ break"
      - { do: wait, ms: 4000 }
    maxSeconds: 45
  s4-fight:
    query: "?skipto=sector4&autoplay=fight&speed=1"
    settings: { audio: { music: 0, voice: 0 }, subtitles: { enabled: false } }
    steps:
      - do: until
        probe: "p.log.includes('line:flash_ai_002') && !p.sim().frozen && (globalThis.__nwRoll = p.sim().tick) >= 0"
        timeoutMs: 120000
        label: "flashback over, sim resumed"
      - { do: roll }
      - do: until
        probe: "p.events.some((e) => e.tick > globalThis.__nwRoll && e.type === 'graze' && e.meter >= 0.3)"
        timeoutMs: 40000
        label: "graze meter 0.3 after the flashback"
      - { do: wait, ms: 3000 }
    maxSeconds: 170
  boss-descent:
    query: "?skipto=boss"
    settings: { audio: { music: 0, voice: 0 }, subtitles: { enabled: false } }
    steps:
      - do: until
        probe: "p.log.includes('line:desc_ai_001')"
        timeoutMs: 40000
        label: "desc_ai_001 starts"
      - { do: wait, ms: 6000 }
    maxSeconds: 60
  boss-fight:
    # Pre-roll through the descent dialogue; the take runs from the first
    # graze to the kill. On this build the autopilot kills the Warden about
    # 16 s into phase 3, before boss_turn_001/002 play (they need about 25 s),
    # so shots anchor on boss_p3_002 and the turn line is added in post.
    query: "?skipto=boss&autoplay=fight&speed=1"
    settings: { audio: { music: 0, voice: 0 }, subtitles: { enabled: false } }
    steps:
      - do: until
        probe: "p.log.includes('line:graze_ai_001')"
        timeoutMs: 90000
        label: "first graze in the boss fight"
      - { do: roll }
      - do: until
        probe: "p.log.includes('scene:ending-kill')"
        timeoutMs: 130000
        label: "kill ending starts"
    maxSeconds: 230

shots:
  - id: hook-writ
    beats: 6
    purpose: "Scene lift: a charged Writ cracks a pod in the first second; genre (vertical shmup, 3D) readable at once."
    take: s2-fight
    anchor: { event: partBreak, where: "e.by === 'writ'", nth: 1 }
    align: 4 # the break lands on the bar-2 downbeat
    game: -8
  - id: graze-curtain
    beats: 6
    purpose: "Skill read: threading a bullet curtain, graze sparks."
    take: s2-fight
    anchor: { event: graze, where: "e.meter >= 0.3" }
    align: 2
    game: -10
  - id: place-kill
    beats: 8
    purpose: "A staged sector with signage, with a kill in it (place and action in one shot, not a vista)."
    take: s4-fight
    anchor: { event: kill, nth: 2 } # a lancer, after a Writ cracks its emitter
    align: 5
    game: -10
  - id: warden-arrives
    beats: 13
    purpose: "The built-up threat arrives; hold on the Warden's silhouette before it speaks."
    take: boss-descent
    anchor: { line: desc_001 }
    align: 13.5 # the shot ends just before the line; warden-stop continues the take
    game: -6
  - id: warden-stop
    beats: 15
    purpose: "Deflation: music dead, the real Warden is shrill and furious, a little funny."
    take: boss-descent
    anchor: { line: desc_001 }
    align: 0.5
    game: 0
  - id: title
    beats: 6
    purpose: "Title on the music's re-entry downbeat."
    card: title
  - id: doubt
    beats: 12
    purpose: "The turn: the Warden says the quiet part; plants the doubt without spoiling either ending."
    take: boss-fight
    # Blind judge (research/2026-10-29-trailer-render): the line sat over a
    # sparse moment; 1 s into phase 3 the Warden is spending everything.
    anchor: { event: bossPhase, where: "e.phase === 3" }
    offset: 1
    align: 0.5
    game: -6
  - id: slate
    beats: 6
    purpose: "End slate: what it is and where to play it."
    card: slate

vo:
  # Offsets are set from measured takes (public/vo/cues.json) so the longest
  # language still clears the next line; the planner checks every language.
  - { line: brief_warden_002, shot: hook-writ, offset: 3 }
  - { line: brief_warden_004, shot: place-kill, offset: 3.5 }
  - { line: desc_001, shot: warden-stop, offset: 0.5 }
  - { line: boss_turn_002, shot: doubt, offset: 0.5 }

cards:
  title:
    style: title
    text: { en: "NEON WARDEN", es: "NEON WARDEN", zh: "霓虹守望者" }
  slate:
    style: slate
    text:
      en: "A vertical slice.\nPlay it in your browser. No install."
      es: "Un vertical slice.\nJuégalo en tu navegador. Sin instalar."
      zh: "垂直切片试玩版\n浏览器即玩，无需安装"
    # The play URL ({{PLAY_URL}}, filled from TRAILER_PLAY_URL) returns when
    # Adam picks hosting; until then the slate names the studio only. Adding
    # it back is a re-assemble from cached takes (--no-capture).
    small:
      en: "adamsmith.systems · CM121 f26"
      es: "adamsmith.systems · CM121 f26"
      zh: "adamsmith.systems · CM121 f26"
