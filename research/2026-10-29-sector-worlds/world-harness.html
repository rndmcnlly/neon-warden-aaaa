<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#020609}canvas{display:block}</style></head><body><script type="module">
import * as THREE from 'three';
import {SectorWorld} from './current/src/world/environment.ts';
import {CameraRig} from './current/src/render/cameraRig.ts';
const p=new URLSearchParams(location.search),s=Number(p.get('sector')||1),lang=p.get('lang')||'es';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x020609);
scene.add(new THREE.HemisphereLight(0x9aabb5,0x11151b,3));
const world=new SectorWorld();scene.add(world.group);
const rig=new CameraRig();rig.resize(innerWidth/innerHeight);
rig.update(0,{player:new THREE.Vector3(),boss:new THREE.Vector3(),stagePoint:new THREE.Vector3(),hangarPoint:new THREE.Vector3(),timeSec:0,aspect:innerWidth/innerHeight});
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);document.body.append(renderer.domElement);
// Synthetic, explicitly combat-free fixture: not footage of actual gameplay.
for(let t=0;t<=600;t++)world.observe({tick:t,sector:s,phase:'sector',enemies:[],bullets:[]},false);
if(p.get('flash')==='1')world.flash(-5,1);
world.update(0,rig.camera,innerWidth,innerHeight,false,true,lang,true);
renderer.render(scene,rig.camera);
window.result={...world.stats(),archive:world.archive.entries(lang)};
</script></body></html>
