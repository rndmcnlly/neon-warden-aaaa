<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Memory and enemy inspection: isolated prototype</title>
<style>
* { box-sizing:border-box } body { margin:0;background:#07121d;color:#e2eef4;font:18px/1.4 system-ui } canvas { position:fixed;inset:0;width:100%;height:100% }
header { position:fixed;top:max(20px,env(safe-area-inset-top));left:5%;right:5%;font:14px/1.5 monospace;letter-spacing:.08em;color:#bdd7e6 }
#readout { margin-top:12px;font-size:17px;color:#f5cb88 } #sub { position:fixed;bottom:max(92px,env(safe-area-inset-bottom));left:8%;right:8%;text-align:center;font-size:clamp(18px,2vw,25px);text-shadow:0 2px 4px #000;background:#07121dd9;padding:12px }
#intel { position:fixed;left:6%;right:6%;bottom:140px;max-width:580px } h1 { font-size:clamp(24px,5vw,40px);margin:0 0 8px } #intel p { margin:0;font-size:20px } footer { position:fixed;left:5%;right:5%;bottom:24px;display:flex;gap:12px;align-items:center;flex-wrap:wrap } button { color:#e2eef4;background:#162b3bdd;border:1px solid #668998;border-radius:4px;padding:10px 18px;font:inherit } #word { color:#ffe1a2 } [hidden] { display:none!important }
@media(max-width:500px) { header{font-size:11px} #readout{font-size:12px} #sub{left:4%;right:4%;bottom:118px;font-size:18px} #intel{bottom:180px} #intel p{font-size:18px} footer{font-size:14px;bottom:20px} }
</style>
<canvas></canvas>
<header><span id="source">FLIGHT RECORDER</span> <span id="clock">00:00.000</span><div id="readout"></div></header>
<div id="sub" hidden></div>
<div id="speaker" hidden style="position:fixed;left:7%;top:23%;font:16px monospace;color:#ffd2a0;background:#07121dd9;padding:8px"></div>
<section id="intel" hidden><h1></h1><p></p></section>
<footer><button id="start">Play</button><button id="skip" hidden>Skip</button><label id="suppress" hidden><input type="checkbox"> Don’t show again</label><span id="status">Isolated presentation prototype</span></footer>
<script type="module" src="./prototype.ts"></script>
</html>
