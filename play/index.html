<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover turns on safe-area insets. Zoom is not disabled
         here (an accessibility right); src/style.css refuses it on the stage. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style"
      content="black-translucent" />
    <meta name="theme-color" content="#080e1c" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/icon-192.png" />
    <title>Neon Warden</title>
    <meta name="description"
      content="Neon Warden: a short vertical shoot-'em-up, free in your browser." />
    <link rel="canonical" href="%SITE_URL%/play/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Neon Warden" />
    <meta property="og:url" content="%SITE_URL%/play/" />
    <meta property="og:title" content="Play Neon Warden" />
    <meta property="og:description" content="A short vertical shoot-'em-up, free in your browser." />
    <meta property="og:image" content="%SITE_URL%/media/og-poster.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A game frame: the Warden, a glowing heart-shaped machine, hovers over a narrow neon lane above the player's ship." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Play Neon Warden" />
    <meta name="twitter:description" content="A short vertical shoot-'em-up, free in your browser." />
    <meta name="twitter:image" content="%SITE_URL%/media/og-poster.jpg" />
    <meta name="twitter:image:alt" content="A game frame: the Warden, a glowing heart-shaped machine, hovers over a narrow neon lane above the player's ship." />
  </head>
  <body>
    <!-- The three.js canvas fills #stage; DOM menus and subtitles sit in #overlay above it. -->
    <div id="stage"></div>
    <div id="overlay"></div>
    <script type="module" src="/src/main.ts"></script>
    <script type="module" src="/src/platform/bootstrap.ts"></script>
  </body>
</html>
