# Build with the same checks as local CI, then publish dist/ to GitHub Pages.
# The site is served at the root of a custom domain
# (neon-warden-aaaa.adamsmith.systems, kept by public/CNAME), so REPO_NAME is
# deliberately unset and vite.config.ts builds with base "/". A fork hosted at
# <user>.github.io/<repo>/ instead would set REPO_NAME here. See
# docs/PUBLISHING.md.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.8
      - name: deno task ci
        run: deno task ci
        env:
          # The landing page's evidence links (vite.config.ts, REPO_URL).
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
